<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロフィール</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    background: #f0f0f0;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  }

  .profile-card {
    width: 400px;
    max-width: 100%;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    padding: 32px;
    text-align: center;
  }

  .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 16px;
  }

  .name {
    margin: 0 0 8px;
    font-size: 20px;
    color: #333;
  }

  .comment {
    margin: 0 0 20px;
    font-size: 14px;
    color: #777;
  }

  .skills {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }

  .skill-badge {
    padding: 6px 12px;
    border-radius: 999px;
    background: #eef1f6;
    color: #4a5a7a;
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="profile-card">
  <img class="avatar" src="https://placehold.jp/100x100.png" alt="プロフィール画像">
  <h1 class="name">山田 太郎</h1>
  <p class="comment">今日も一歩ずつ、コツコツと。</p>
  <div class="skills" id="skills"></div>
</div>

<script>
  const skills = ['HTML', 'CSS', 'JavaScript', 'Git'];

  const skillsContainer = document.getElementById('skills');

  skills.forEach(skill => {
    const badge = document.createElement('span');
    badge.className = 'skill-badge';
    badge.textContent = skill;
    skillsContainer.appendChild(badge);
  });
</script>

</body>
</html>
