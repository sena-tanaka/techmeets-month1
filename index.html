<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToDoリスト</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 20px;
    background: #f0f2f5;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  }

  .container {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    padding: 32px;
  }

  h1 {
    margin: 0 0 24px;
    font-size: 22px;
    color: #333;
    text-align: center;
  }

  .input-area {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  #taskInput {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  #taskInput:focus {
    border-color: #6c8cff;
  }

  #addBtn {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: #6c8cff;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }

  #addBtn:hover {
    background: #5477ff;
  }

  #taskList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .task-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: #f7f8fa;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .task-item:hover {
    background: #eef1f6;
  }

  .task-text {
    flex: 1;
    font-size: 15px;
    color: #333;
    word-break: break-all;
    margin-right: 10px;
  }

  .task-item.completed .task-text {
    text-decoration: line-through;
    color: #aaa;
  }

  .delete-btn {
    border: none;
    background: #ff6b6b;
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .delete-btn:hover {
    background: #ee5555;
  }

  .empty-message {
    text-align: center;
    color: #aaa;
    font-size: 14px;
    padding: 20px 0;
  }

  .task-count {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-top: 16px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>ToDoリスト</h1>

  <div class="input-area">
    <input type="text" id="taskInput" placeholder="タスクを入力...">
    <button id="addBtn">追加</button>
  </div>

  <ul id="taskList"></ul>

  <p class="task-count" id="taskCount"></p>
</div>

<script>
  let tasks = [];
  let nextId = 1;

  const taskInput = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const taskList = document.getElementById('taskList');
  const taskCount = document.getElementById('taskCount');

  function addTask() {
    const text = taskInput.value.trim();
    if (text === '') return;

    tasks.push({ id: nextId++, text: text, completed: false });
    taskInput.value = '';
    render();
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
      task.completed = !task.completed;
      render();
    }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    render();
  }

  function render() {
    taskList.innerHTML = '';

    const completedCount = tasks.filter(t => t.completed).length;
    taskCount.textContent = tasks.length === 0
      ? ''
      : `${completedCount} / ${tasks.length} 件完了`;

    if (tasks.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'empty-message';
      empty.textContent = 'タスクがありません';
      taskList.appendChild(empty);
      return;
    }

    tasks.forEach(task => {
      const li = document.createElement('li');
      li.className = 'task-item' + (task.completed ? ' completed' : '');

      const span = document.createElement('span');
      span.className = 'task-text';
      span.textContent = task.text;
      span.addEventListener('click', () => toggleTask(task.id));

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = '削除';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteTask(task.id);
      });

      li.appendChild(span);
      li.appendChild(delBtn);
      taskList.appendChild(li);
    });
  }

  addBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
  });

  render();
</script>

</body>
</html>
