<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スライドショー</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    background: #f0f2f5;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  }

  .slideshow {
    width: 100%;
    max-width: 640px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    padding: 24px;
    text-align: center;
  }

  h1 {
    margin: 0 0 20px;
    font-size: 22px;
    color: #333;
  }

  #slideImage {
    width: 100%;
    max-width: 600px;
    border-radius: 12px;
    display: block;
    margin: 0 auto;
  }

  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin-top: 20px;
  }

  .nav-btn {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #6c8cff;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .nav-btn:hover {
    background: #5477ff;
  }

  #slideCounter {
    font-size: 14px;
    color: #888;
  }
</style>
</head>
<body>

<div class="slideshow">
  <h1>スライドショー</h1>

  <img id="slideImage" src="" alt="スライド画像">

  <div class="controls">
    <button class="nav-btn" id="prevBtn">前へ</button>
    <span id="slideCounter"></span>
    <button class="nav-btn" id="nextBtn">次へ</button>
  </div>
</div>

<script>
  const images = [
    'https://placehold.jp/600x300.png?text=Slide%201',
    'https://placehold.jp/600x300.png?text=Slide%202',
    'https://placehold.jp/600x300.png?text=Slide%203',
    'https://placehold.jp/600x300.png?text=Slide%204'
  ];

  let currentIndex = 0;

  const slideImage = document.getElementById('slideImage');
  const slideCounter = document.getElementById('slideCounter');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function render() {
    slideImage.src = images[currentIndex];
    slideCounter.textContent = (currentIndex + 1) + ' / ' + images.length;
  }

  function showPrev() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    render();
  }

  function showNext() {
    currentIndex = (currentIndex + 1) % images.length;
    render();
  }

  prevBtn.addEventListener('click', showPrev);
  nextBtn.addEventListener('click', showNext);

  render();
</script>

</body>
</html>
